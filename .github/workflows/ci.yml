name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use mocked HTTP responses. An empty key guarantees no live requests
  # can authenticate, and no repository secret is ever exposed to the job.
  COINGECKO_API_KEY: ""
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Check installed dependencies are consistent
        run: python -m pip check

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  lock-files:
    # Lock files are generated on Windows with Python 3.13 (see README), so they
    # are re-generated on the same platform and compared with the committed copy.
    name: Lock files up to date
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-tools
        run: python -m pip install -r requirements-dev.txt

      - name: Re-compile lock files
        run: |
          pip-compile --quiet -o requirements.txt pyproject.toml
          pip-compile --quiet --extra dev -o requirements-dev.txt pyproject.toml

      - name: Fail if lock files changed
        run: git diff --exit-code -- requirements.txt requirements-dev.txt
